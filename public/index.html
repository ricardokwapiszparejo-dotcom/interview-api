<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auditorías energéticas</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: end; margin-bottom: 1.5rem; }
    label { display: flex; flex-direction: column; font-size: .8rem; gap: .2rem; }
    input { padding: .4rem; font-size: 1rem; }
    button { padding: .45rem .8rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #ddd; font-size: .9rem; }
    .estado { font-weight: 600; }
    .PENDIENTE { color: #b07d00; }
    .CONFIRMADA { color: #1a7f37; }
    .CANCELADA { color: #999; }
    tr.CANCELADA td { color: #999; }
    #error { color: #b3261e; min-height: 1.2rem; font-size: .9rem; margin: .5rem 0; }
    #cancel-edit { display: none; }
  </style>
</head>
<body>
  <h1>Reservas de auditorías energéticas</h1>

  <form id="audit-form">
    <label>Cliente <input name="cliente" required /></label>
    <label>Técnico <input name="tecnico" required /></label>
    <button type="submit" id="submit-btn">Crear</button>
    <button type="button" id="cancel-edit">Descartar edición</button>
  </form>
  <p id="error"></p>

  <table>
    <thead>
      <tr><th>Fecha y hora</th><th>Cliente</th><th>Técnico</th><th>Estado</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const form = document.getElementById('audit-form');
    const rows = document.getElementById('rows');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');
    const cancelEditBtn = document.getElementById('cancel-edit');
    let editingId = null; // null = create mode, otherwise the audit being edited via PUT

    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(`${res.status} · ${body.error ?? res.statusText}`);
      }
      return res.status === 204 ? null : res.json();
    }

    function fmt(iso) {
      return iso.replace('T', ' ').slice(0, 16);
    }

    async function refresh() {
      const audits = await api('/audits');
      audits.sort((a, b) => a.fechaHora.localeCompare(b.fechaHora));
      rows.replaceChildren(...audits.map(renderRow));
    }

    function renderRow(audit) {
      const tr = document.createElement('tr');
      tr.className = audit.estado;
      tr.innerHTML = `
        <td>${fmt(audit.fechaHora)}</td>
        <td></td><td></td>
        <td class="estado ${audit.estado}">${audit.estado}</td>
        <td></td>`;
      tr.children[1].textContent = audit.cliente;
      tr.children[2].textContent = audit.tecnico;

      const actions = tr.children[4];
      if (audit.estado === 'PENDIENTE') {
        actions.append(
          button('Editar', () => startEdit(audit)),
          button('Confirmar', () => action(() => api(`/audits/${audit.id}`, put({ cliente: audit.cliente, tecnico: audit.tecnico, estado: 'CONFIRMADA' })))),
        );
      }
      if (audit.estado !== 'CANCELADA') {
        actions.append(button('Cancelar', () => action(() => api(`/audits/${audit.id}`, { method: 'DELETE' }))));
      }
      return tr;
    }

    function button(label, onClick) {
      const b = document.createElement('button');
      b.textContent = label;
      b.addEventListener('click', onClick);
      return b;
    }

    function put(body) {
      return { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    }

    function startEdit(audit) {
      editingId = audit.id;
      form.cliente.value = audit.cliente;
      form.tecnico.value = audit.tecnico;
      submitBtn.textContent = 'Guardar';
      cancelEditBtn.style.display = 'inline';
      form.cliente.focus();
    }

    function resetForm() {
      editingId = null;
      form.reset();
      submitBtn.textContent = 'Crear';
      cancelEditBtn.style.display = 'none';
    }

    async function action(fn) {
      errorEl.textContent = '';
      try {
        await fn();
        await refresh();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const body = { cliente: form.cliente.value.trim(), tecnico: form.tecnico.value.trim() };
      action(async () => {
        if (editingId) {
          await api(`/audits/${editingId}`, put(body));
        } else {
          await api('/audits', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        }
        resetForm();
      });
    });

    cancelEditBtn.addEventListener('click', resetForm);
    refresh().catch((err) => { errorEl.textContent = err.message; });
  </script>
</body>
</html>
